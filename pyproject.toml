[project]
name = "notes2pdf"
version = "0.1.0"
description = "Turn notes (Notion and other apps) into PDFs, grouping sections as you choose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "notion-client>=2.2",
    "weasyprint>=62",
    "jinja2>=3.1",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "ziamath>=0.13",
    "pygments>=2.21.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes2pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
